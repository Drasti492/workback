<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>In-Site Mailbox – RemoteJobs Pro</title>

  <!-- Tailwind CDN (playtailwind) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js CDN -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #a0aec0; border-radius: 3px; }
  </style>
</head>

<body class="h-full bg-gray-50 flex flex-col">

<!-- ===== HEADER (with bell badge) ===== -->
<header class="bg-white shadow-sm border-b">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
    <h1 class="text-xl font-semibold text-gray-800">RemoteJobs Pro</h1>
    <div class="relative" x-data="{ open: false }">
      <button @click="open = !open"
              class="relative p-2 rounded-full hover:bg-gray-100 focus:outline-none">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor"
             viewBox="0 0 24 24"><path stroke-linecap="round"
             stroke-linejoin="round" stroke-width="2"
             d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        <span x-show="$store.mailbox.unreadCount"
              class="absolute top-0 right-0 block w-2 h-2 bg-red-500 rounded-full"></span>
      </button>

      <!-- Dropdown (optional quick view) -->
      <div x-show="open" @click.away="open = false"
           class="absolute right-0 mt-2 w-64 bg-white rounded-md shadow-lg z-50">
        <div class="py-1">
          <template x-for="m in $store.mailbox.messages.filter(i=>!i.is_read)" :key="m.id">
            <a href="#" @click.prevent="$store.mailbox.select(m.id); open=false"
               class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
              <span x-text="m.subject"></span>
            </a>
          </template>
          <div class="border-t border-gray-200"></div>
          <a href="#" @click.prevent="$store.mailbox.select(null); open=false"
             class="block px-4 py-2 text-sm text-indigo-600 font-medium hover:bg-gray-100">
             View All Messages →
          </a>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- ===== MAIN MAILBOX AREA ===== -->
<div class="flex-1 flex overflow-hidden" x-data="{ selected: null }" x-init="
  // Global store (Alpine 3)
  Alpine.store('mailbox', {
    messages: [
      { id:1, user_id:1, type:'application', subject:'Application received — Data Entry Assistant',
        body:`Hi Alex,<br>We’ve submitted your application for <strong>Data Entry Assistant</strong> at Acme Corp.<br>Application ID: <code>#A12345</code><br><a href='#' class='text-indigo-600 underline'>View Application</a>`,
        is_read:false, category:'Applications', created_at:'2025-11-08 14:32' },
      { id:2, user_id:1, type:'payment', subject:'Payment successful — Order #P987',
        body:`Thank you for your payment of <strong>$10.40</strong> for a Priority Connect.<br>Your application has been upgraded.<br><a href='#' class='text-indigo-600 underline'>Download Receipt</a>`,
        is_read:false, category:'Payments', created_at:'2025-11-08 13:10' },
      { id:3, user_id:1, type:'verification', subject:'Profile verified ✅',
        body:`Hi Alex,<br>Your profile is now <strong>verified</strong>. You appear higher in employer searches.<br>Keep details updated to maintain verification.`,
        is_read:true, category:'Verification', created_at:'2025-11-07 09:15' },
      { id:4, user_id:1, type:'application', subject:'Application received — UI Designer',
        body:`Your application for UI Designer at StartupXYZ is in review.<br>Application ID: <code>#A12346</code>`,
        is_read:true, category:'Applications', created_at:'2025-11-06 11:20' }
    ],
    get unreadCount(){ return this.messages.filter(m=>!m.is_read).length; },
    select(id){ $dispatch('select-message', id); },
    markRead(id){ const m=this.messages.find(x=>x.id===id); if(m) m.is_read=true; },
    archive(id){ this.messages = this.messages.filter(x=>x.id!==id); }
  });

  // Listen for selection
  $watch('$store.mailbox.messages', () => {});
">

  <!-- ===== SIDEBAR ===== -->
  <aside class="w-64 bg-white border-r flex flex-col">
    <div class="p-4">
      <h2 class="font-semibold text-lg text-gray-800">Mailbox</h2>
    </div>

    <nav class="flex-1 overflow-y-auto scrollbar-thin">
      <ul class="space-y-1 px-2">
        <li><a href="#" @click.prevent="$dispatch('filter', null)"
               class="flex items-center px-3 py-2 rounded-md hover:bg-gray-100 font-medium"
               :class="{'bg-indigo-50 text-indigo-700': !filter}">Inbox <span x-show="$store.mailbox.unreadCount" class="ml-auto bg-red-500 text-white text-xs rounded-full px-2" x-text="$store.mailbox.unreadCount"></span></a></li>

        <li><a href="#" @click.prevent="$dispatch('filter', 'unread')"
               class="flex items-center px-3 py-2 rounded-md hover:bg-gray-100"
               :class="{'bg-indigo-50 text-indigo-700': filter==='unread'}">Unread</a></li>

        <li><a href="#" @click.prevent="$dispatch('filter', 'Applications')"
               class="flex items-center px-3 py-2 rounded-md hover:bg-gray-100"
               :class="{'bg-indigo-50 text-indigo-700': filter==='Applications'}">Applications</a></li>

        <li><a href="#" @click.prevent="$dispatch('filter', 'Payments')"
               class="flex items-center px-3 py-2 rounded-md hover:bg-gray-100"
               :class="{'bg-indigo-50 text-indigo-700': filter==='Payments'}">Payments</a></li>

        <li><a href="#" @click.prevent="$dispatch('filter', 'Verification')"
               class="flex items-center px-3 py-2 rounded-md hover:bg-gray-100"
               :class="{'bg-indigo-50 text-indigo-700': filter==='Verification'}">Verification</a></li>

        <li><a href="#" @click.prevent="$dispatch('filter', 'Archived')"
               class="flex items-center px-3 py-2 rounded-md hover:bg-gray-100"
               :class="{'bg-indigo-50 text-indigo-700': filter==='Archived'}">Archived</a></li>
      </ul>
    </nav>
  </aside>

  <!-- ===== MESSAGE LIST ===== -->
  <section class="flex-1 flex flex-col bg-gray-50" x-data="{ filter: null }" @filter.window="filter = $event.detail">
    <div class="bg-white border-b p-4 flex justify-between items-center">
      <h3 class="font-medium text-gray-800" x-text="filter ? filter : 'Inbox'"></h3>
      <button @click="$store.mailbox.messages.forEach(m=>m.is_read=true)"
              class="text-sm text-indigo-600 hover:underline">Mark all as read</button>
    </div>

    <div class="flex-1 overflow-y-auto scrollbar-thin" x-show="!selected">
      <template x-for="msg in filteredMessages" :key="msg.id">
        <div @click="$store.mailbox.select(msg.id); $store.mailbox.markRead(msg.id)"
             class="p-4 border-b hover:bg-gray-100 cursor-pointer flex items-start space-x-3"
             :class="{'bg-white': msg.is_read, 'bg-indigo-50 font-medium': !msg.is_read}">
          <div class="flex-shrink-0">
            <template x-if="msg.type==='application'"><svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6-4h6m-6 8h6m-9-8v12"/></svg></template>
            <template x-if="msg.type==='payment'"><svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg></template>
            <template x-if="msg.type==='verification'"><svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></template>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-900 truncate" x-text="msg.subject"></p>
            <p class="text-sm text-gray-500 truncate" x-html="msg.body.replace(/<[^>]*>/g,'').substring(0,70)+'...'"></p>
          </div>
          <p class="text-xs text-gray-400 whitespace-nowrap" x-text="msg.created_at"></p>
        </div>
      </template>

      <div class="p-8 text-center text-gray-500" x-show="filteredMessages.length === 0">
        No messages here.
      </div>
    </div>

    <!-- ===== MESSAGE DETAIL ===== -->
    <div class="flex-1 bg-white overflow-y-auto scrollbar-thin" x-show="selected" x-cloak>
      <template x-if="selectedMsg">
        <div class="p-6 space-y-4">
          <div class="flex justify-between items-start">
            <h2 class="text-xl font-semibold text-gray-900" x-text="selectedMsg.subject"></h2>
            <button @click="selected = null; $store.mailbox.markRead(selectedMsg.id)"
                    class="text-gray-400 hover:text-gray-600">✕</button>
          </div>
          <p class="text-sm text-gray-500" x-text="selectedMsg.created_at"></p>
          <div class="prose prose-sm max-w-none" x-html="selectedMsg.body"></div>

          <div class="pt-4 flex space-x-3">
            <button @click="$store.mailbox.archive(selectedMsg.id); selected=null"
                    class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 text-sm">
              Archive
            </button>
            <button @click="$store.mailbox.markRead(selectedMsg.id)"
                    class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 text-sm">
              Mark as Read
            </button>
          </div>

          <footer class="mt-8 pt-4 border-t text-xs text-gray-400">
            Need help? Email <a href="mailto:support@remotejobspro.com" class="text-indigo-600">support@remotejobspro.com</a>
          </footer>
        </div>
      </template>
    </div>
  </section>
</div>

<script>
  // Helper: filtered list
  document.addEventListener('alpine:init', () => {
    Alpine.data('mailboxList', () => ({
      get filteredMessages() {
        const msgs = Alpine.store('mailbox').messages;
        const f = this.filter;
        if (!f) return msgs;
        if (f === 'unread') return msgs.filter(m => !m.is_read);
        if (f === 'Archived') return []; // archived are removed
        return msgs.filter(m => m.category === f);
      }
    }));
  });

  // Selection handling
  document.addEventListener('select-message', e => {
    const id = e.detail;
    const component = Alpine.$data(document.querySelector('[x-data]'));
    component.selected = id;
  });

  // Expose selected message for detail view
  Alpine.bind('selectedMsg', () => ({
    get selectedMsg() {
      const id = Alpine.$data(document.querySelector('[x-data]')).selected;
      return Alpine.store('mailbox').messages.find(m => m.id === id) || null;
    }
  }));
</script>

</body>
</html>
